<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameHub - تنظیمات</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">GameHub</div>
      <a href="index.html" class="nav-item">🏠 <span>خانه</span></a>
      <a href="search.html" class="nav-item">🔍 <span>جستجو</span></a>
      <a href="#" id="navProfile" class="nav-item">👤 <span>پروفایل</span></a>
      <a href="settings.html" class="nav-item active">⚙️ <span>تنظیمات</span></a>
      <button class="nav-item" id="logoutBtn" style="margin-top:auto">🚪 <span>خروج</span></button>
    </aside>
    <main class="main">
      <div class="header-bar">تنظیمات حساب</div>
      <div style="padding:24px;max-width:500px">
        <div class="form-group">
          <label>نام نمایشی</label>
          <input type="text" id="displayName">
        </div>
        <div class="form-group">
          <label>نام کاربری</label>
          <input type="text" id="username" pattern="[a-zA-Z0-9_]{3,20}">
        </div>
        <div class="form-group">
          <label>بیو</label>
          <textarea id="bio" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>عکس پروفایل</label>
          <input type="file" id="avatarInput" accept="image/*">
          <img id="avatarPreview" class="avatar" style="margin-top:8px;display:none">
        </div>
        <div class="form-group">
          <label>عکس کاور</label>
          <input type="file" id="coverInput" accept="image/*">
        </div>
        <button class="btn btn-primary" id="saveBtn" style="width:100%;margin-bottom:24px">ذخیره تغییرات</button>
        
        <hr style="border-color:var(--border);margin:32px 0">
        <h3 style="color:var(--danger);margin-bottom:12px">منطقه خطر</h3>
        <button class="btn btn-danger" id="deleteAccountBtn" style="width:100%">حذف کامل حساب کاربری</button>
      </div>
    </main>
    <aside class="right-sidebar"></aside>
  </div>
  <script src="js/supabase.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
